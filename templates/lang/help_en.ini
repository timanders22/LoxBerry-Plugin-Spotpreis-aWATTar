; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Spot price aWATTar"
K02 = "Fetches the hourly exchange electricity prices (EPEX SPOT day-ahead) through the open <b>aWATTar API</b> (Germany or Austria), works them up with your own price components into the <b>final price in ct/kWh</b> and delivers them to Loxone, through MQTT and as JSON — with an hourly spoken announcement and a push trigger."
K03 = "No account, no API key, no cloud dependency. Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, runs with PHP 7.4 and 8.x)."
K04 = "Features"
K05 = "<b>Final price instead of exchange price</b>: grid fees, electricity tax, concession levy, surcharges, supplier margin and VAT are each adjustable (2026 reference values pre-filled, DE and AT)"
K06 = "Current hour, next hour, exchange share, <b>rank</b> of the current hour within the next 24 h, <b>price level</b> (cheap/normal/expensive through freely chosen thresholds), a flag for negative exchange prices"
K07 = "Cheapest and most expensive hour and the daily average for <b>today and tomorrow</b>"
K08 = "<b>The cheapest contiguous X-hour window</b> (length adjustable) — ideal for the washing machine, dishwasher, electric car or hot water"
K09 = "<b>Hourly announcement (TTS)</b>, enabled per hour by a tick box; optionally only below the cheap threshold, additionally always on a negative price, and a day-ahead preview announcement as soon as tomorrow's prices are published"
K10 = "<b>Push trigger</b> for Loxone (<code>ANN</code>) including a test push function"
K11 = "<b>CO₂ intensity</b> of the electricity mix as a second indicator (Fraunhofer ISE Energy-Charts, free and without an account): the current value, the cleanest hour of the next 24 h, a „green electricity time“ flag — for CO₂-optimised switching"
K12 = "<b>A second price set under § 14a EnWG</b> for a controllable heat pump or wallbox with a metering point of its own (reduced grid fee + off-peak concession levy)"
K13 = "<b>Tariff comparison fixed ↔ dynamic</b>: a monthly table with a load-profile-weighted average against your own fixed price, in ct/kWh and euros — plus a monthly report as an announcement/log entry on the first of the month. The grid consumption can be entered <b>per month</b> (important with PV: a lot of purchased power in winter at high exchange prices, little in summer); the annual consumption is then the sum"
K14 = "<b>Savings from shifted consumption</b>: what would it have gained to shift X kWh a day into the cheapest hour (weekly figure and an annual projection)"
K15 = "<b>Optional coupling with the Marstek battery plugin</b> (off by default): charges the battery during the X cheapest hours or when the price is negative"
K16 = "<b>MQTT</b> through the LoxBerry MQTT gateway, <b>JSON</b> including all hourly values"
K17 = "A price chart (today + tomorrow) in the interface, a history of daily values, and the <b>history as CSV</b> for checking the figures yourself"
K18 = "Tabs: Settings, MQTT, Loxone integration (step by step including a complete list of blocks for a one-to-one rebuild), Cost comparison, Test, Log files"
K19 = "The configuration and log survive updates and reinstallation"
K20 = "Endpoints"
K21 = "Price components (default: a large German city, 2026)"
K22 = "Example: 8.00 ct exchange price → <b>26.01 ct/kWh</b> final price."
K23 = "All values can be changed freely — please check them against your own electricity bill. Grid fees vary strongly by region (typically 5–12 ct/kWh); the price sheet of your own grid operator names the energy rate in the „standing charge / energy rate system“. The concession levy depends on the size of the municipality: up to 25,000 inhabitants 1.32 · up to 100,000 1.59 · up to 500,000 1.99 · above 500,000 2.39 ct/kWh."
K24 = "<b>§ 14a EnWG</b> (the second price set, optional): controllable heat pump 3.43 · storage heating 1.71 · electric mobility 4.28 · module 2 flat rate 2.59 · module 3 peak 7.14 / off-peak 2.59 ct/kWh (example values for 2026), off-peak concession levy 0.61 ct/kWh."
K25 = "Privacy"
K26 = "The plugin contains <b>no personal data</b>. All settings are kept locally (<code>config/plugins/spotpreis/spot.json</code>). The only external connection is to the public aWATTar price API (without any identifier)."
K27 = "Call"
K28 = "Purpose"
K29 = "<code>/plugins/spotpreis/spot.php</code>"
K30 = "Loxone line <code>SPOT;OK=..;MINH=..;…;CUR=..;RANK=..;LEVEL=..;WINH=..;ANN=..</code>"
K31 = "<code>/plugins/spotpreis/spot.php?debug=1</code>"
K32 = "all hourly prices for today and tomorrow"
K33 = "<code>/plugins/spotpreis/spot.php?refresh=1</code>"
K34 = "Fetch market data immediately — <b>token required</b>"
K35 = "<code>/plugins/spotpreis/spot.php?json=1</code>"
K36 = "complete state as JSON"
K37 = "<code>/plugins/spotpreis/spot.php?say=1</code>"
K38 = "Test announcement (current price) — <b>token required</b>"
K39 = "<code>/plugins/spotpreis/spot.php?saytomorrow=1</code>"
K40 = "Test announcement (tomorrow's prices) — <b>token required</b>"
K41 = "<code>/plugins/spotpreis/spot.php?ptest=1</code>"
