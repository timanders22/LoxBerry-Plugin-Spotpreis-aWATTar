K61 = "<b>Heartbeat</b> (<code>TS</code> and <code>LAUF</code>): this is how the Miniserver can tell whether the plugin is still working. Without it, a failure leaves the last price standing in Loxone and everything looks normal in the app — that is not missing information but a false statement."
K62 = "<b>Back up and restore the settings</b> with two buttons — for moving to a second LoxBerry. The file carries the action token and must therefore be treated like a password."
K63 = "Optional: <b>your own load curve</b> instead of the built-in household profile, so that the tariff comparison becomes a measurement rather than a model (switched off by default)"
