K61 = "<b>Lebenszeichen</b> (<code>TS</code> und <code>LAUF</code>): daran erkennt der Miniserver, ob das Plugin noch arbeitet. Ohne das steht bei einem Ausfall weiterhin der letzte Preis in Loxone, und in der App sieht alles normal aus — das ist keine fehlende Auskunft, sondern eine Falschaussage."
K62 = "<b>Einstellungen sichern und zurückspielen</b> über zwei Knöpfe — für den Umzug auf einen zweiten LoxBerry. Die Datei trägt den Aktionstoken und ist deshalb wie ein Passwort zu behandeln."
K63 = "Optional: <b>eigener Lastgang</b> statt des eingebauten Haushaltsprofils, damit der Tarifvergleich eine Messung wird statt einer Modellrechnung (ab Werk aus)"
