; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Spotpreis aWATTar"
K02 = "Holt die stündlichen Börsenstrompreise (EPEX SPOT Day-Ahead) über die offene <b>aWATTar-API</b> (Deutschland oder Österreich), rechnet sie mit den eigenen Preisbestandteilen auf den <b>Endpreis in ct/kWh</b> hoch und liefert sie an Loxone, per MQTT und als JSON — mit stündlicher Sprachansage und Push-Auslöser."
K03 = "Kein Konto, kein API-Key, keine Cloud-Bindung. Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, läuft mit PHP 7.4 und 8.x)."
K04 = "Funktionen"
K05 = "<b>Endpreis statt Börsenpreis</b>: Netzentgelte, Stromsteuer, Konzessionsabgabe, Umlagen, Anbieter-Aufschlag und Umsatzsteuer sind einzeln einstellbar (Richtwerte 2026 vorbelegt, DE und AT)"
K06 = "Aktuelle Stunde, nächste Stunde, Börsenanteil, <b>Rang</b> der laufenden Stunde in den nächsten 24 h, <b>Preisniveau</b> (günstig/normal/teuer über frei wählbare Schwellen), Flag für negative Börsenpreise"
K07 = "Günstigste/teuerste Stunde und Tagesdurchschnitt für <b>heute und morgen</b>"
K08 = "<b>Günstigstes zusammenhängendes X-Stunden-Fenster</b> (Länge einstellbar) — ideal für Waschmaschine, Spülmaschine, E-Auto, Warmwasser"
K09 = "<b>Stündliche Ansage (TTS)</b>, je Stunde per Checkbox aktivierbar; optional nur unterhalb der Günstig-Schwelle, zusätzlich immer bei negativem Preis, und eine Tagesvorschau-Ansage, sobald die Preise für morgen veröffentlicht sind"
K10 = "<b>Push-Auslöser</b> für Loxone (<code>ANN</code>) samt Test-Push-Funktion"
K11 = "<b>CO₂-Intensität</b> des Strommixes als zweite Kennzahl (Fraunhofer ISE Energy-Charts, kostenlos und ohne Konto): aktueller Wert, sauberste Stunde der nächsten 24 h, Flag „Ökostrom-Zeit“ — für CO₂-optimiertes Schalten"
K12 = "<b>Zweiter Preissatz nach § 14a EnWG</b> für steuerbare Wärmepumpe oder Wallbox mit eigenem Zählpunkt (reduziertes Netzentgelt + Schwachlast-Konzessionsabgabe)"
K13 = "<b>Tarifvergleich fest ↔ dynamisch</b>: Monatstabelle mit lastprofil-gewichtetem Durchschnitt gegen den eigenen Festpreis, in ct/kWh und Euro — plus Monatsbericht als Ansage/Protokoll am Monatsersten. Der Netzbezug lässt sich <b>je Monat</b> eintragen (wichtig mit PV: im Winter viel Zukauf bei hohen Börsenpreisen, im Sommer wenig); der Jahresverbrauch ergibt sich dann automatisch aus der Summe"
K14 = "<b>Ersparnis durch verschobenen Verbrauch</b>: Was hätte es gebracht, täglich X kWh in die günstigste Stunde zu verschieben (Woche und Jahreshochrechnung)"
K15 = "<b>Optionale Kopplung mit dem Marstek-Speicher-Plugin</b> (Standard aus): lädt den Speicher in den X günstigsten Stunden bzw. bei negativem Preis"
K16 = "<b>MQTT</b> über das LoxBerry MQTT Gateway, <b>JSON</b> inklusive aller Stundenwerte"
K17 = "Preisdiagramm (heute + morgen) in der Oberfläche, Tageswert-Historie, <b>Verlauf als CSV</b> zum Nachrechnen"
K18 = "Reiter: Einstellungen, MQTT, Einbindung in Loxone (Schritt-für-Schritt inkl. kompletter Baustein-Liste zum 1:1-Nachbauen), Kostenvergleich, Test, Logdateien"
K19 = "Konfiguration und Log überleben Updates und Neuinstallation"
K20 = "Endpunkte"
K21 = "Preisbestandteile (Voreinstellung: deutsche Großstadt, 2026)"
K22 = "Beispiel: 8,00 ct Börsenpreis → <b>26,01 ct/kWh</b> Endpreis."
K23 = "Alle Werte sind frei änderbar — bitte mit der eigenen Stromrechnung abgleichen. Netzentgelte sind stark regional (typisch 5–12 ct/kWh); das Preisblatt des eigenen Netzbetreibers nennt den Arbeitspreis im „Grundpreis-/Arbeitspreissystem“. Konzessionsabgabe nach Gemeindegröße: bis 25.000 EW 1,32 · bis 100.000 EW 1,59 · bis 500.000 EW 1,99 · über 500.000 EW 2,39 ct/kWh."
K24 = "<b>§ 14a EnWG</b> (zweiter Preissatz, optional): steuerbare Wärmepumpe 3,43 · Speicherheizung 1,71 · Elektromobilität 4,28 · Modul 2 pauschal 2,59 · Modul 3 HT 7,14 / NT 2,59 ct/kWh (Beispielwerte 2026), Konzessionsabgabe Schwachlast 0,61 ct/kWh."
K25 = "Datenschutz"
K26 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Alle Einstellungen liegen lokal (<code>config/plugins/spotpreis/spot.json</code>). Externe Verbindungen gibt es ausschließlich zur öffentlichen aWATTar-Preis-API (ohne Kennung)."
K27 = "Aufruf"
K28 = "Zweck"
K29 = "<code>/plugins/spotpreis/spot.php</code>"
K30 = "Loxone-Zeile <code>SPOT;OK=..;MINH=..;…;CUR=..;RANK=..;LEVEL=..;WINH=..;ANN=..</code>"
K31 = "<code>/plugins/spotpreis/spot.php?debug=1</code>"
K32 = "alle Stundenpreise heute + morgen"
K33 = "<code>/plugins/spotpreis/spot.php?refresh=1</code>"
K34 = "Marktdaten sofort neu abrufen — <b>Token nötig</b>"
K35 = "<code>/plugins/spotpreis/spot.php?json=1</code>"
K36 = "kompletter Zustand als JSON"
K37 = "<code>/plugins/spotpreis/spot.php?say=1</code>"
K38 = "Test-Ansage (aktueller Preis) — <b>Token nötig</b>"
K39 = "<code>/plugins/spotpreis/spot.php?saytomorrow=1</code>"
K40 = "Test-Ansage (Preise für morgen) — <b>Token nötig</b>"
K41 = "<code>/plugins/spotpreis/spot.php?ptest=1</code>"
K42 = "Test-Pushnachricht auslösen — <b>Token nötig</b>"
