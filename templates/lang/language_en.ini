ERKLAERUNG = "Up to 1.1.2 every switching rule worked on its own. Heat pump, wallbox and washing machine found the same cheapest hour and all switched on at once. The planner changes three things: rules can have a <b>deadline</b> and an energy figure, they share a <b>power budget</b> by rank, and a <b>PV forecast</b> moves the plan into the sunny hours. All three are off out of the box - change nothing and you get the previous behaviour."
