L_BIS = "Time window until (hour)"
L_HORIZONT = "Horizon (next X hours)"
L_N = "Number of hours N"
L_NAME = "Name (appears in the template)"
L_NEG = "always switch on when the exchange price is negative"
L_PROFIL = "Also send the hourly profile (PH00-PH23, PM00-PM23)"
L_PROZENT = "Distance from the daily average (%)"
L_SCHWELLE = "Fixed threshold (ct/kWh)"
L_VON = "Time window from (hour)"
P_NAME = "e.g. wallbox"
