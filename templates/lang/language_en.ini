MARSTEK_FREMDSCHREIBER = "Second hand: if Loxone controls the Marstek (setpoint via ?p=), this coupling is a second writer on the same battery – during the cheap hours both overwrite each other. A Marstek version with writer watch reports second writers on its Test tab and in its log – the coupling identifies itself as “awattar” (parameter von=awattar). Recommendation: build the spot charging in Loxone (RANK or a switching rule, there with the surplus condition at the meter) and leave this coupling off."
