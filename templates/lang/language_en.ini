ERKLAERUNG = "Up to 1.0.3 the plugin only delivered numbers: start hour, hours until then, average price. Turning that into “charge now” was work in the Miniserver. A switching rule answers the question here and outputs <b>a one or a zero</b> - in Loxone Config all that remains is connecting a digital input. Every rule knows a time window and a horizon, which is what makes “the 3 cheapest hours between 22:00 and 06:00” answerable at all - the old window calculation could not do that."
H_AUSGANG = "Delivers <span class='sm-mono'>R%d</span> (0/1), <span class='sm-mono'>R%dIN</span> (hours until the next window), <span class='sm-mono'>R%dREST</span> (remaining hours) and <span class='sm-mono'>R%dCT</span> (average in the window)."
H_MIN_LAUF = "Shorter blocks are extended forwards; if that is not enough they are dropped. 0 = off. This plugin calculates in <b>hours</b> — a value below 60 minutes has no effect here."
H_MIN_PAUSE = "Shorter pauses are closed — the device keeps running instead of switching off and straight back on. 0 = off. Useful from 120 minutes, because a pause here is always at least one full hour."
H_PROFIL = "Additionally sends <span class='sm-mono'>PH00</span> to <span class='sm-mono'>PH23</span> for today and <span class='sm-mono'>PM00</span> to <span class='sm-mono'>PM23</span> for tomorrow - the final price of every hour. This brings the daily profile into the visualisation without JSON. If you do not need it, you save 48 virtual inputs."
H_TITEL = "Switching rules - ready-made 0/1 signals for Loxone"
H_VORLAGE = "Create everything at once"
H_VORLAGE_TEXT = "Instead of creating every value by hand as a virtual input: this file contains all values with unit, limits and comment, the switching rules as <b>digital</b> inputs, and the names given above. <b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing - importing twice yields duplicate blocks."
