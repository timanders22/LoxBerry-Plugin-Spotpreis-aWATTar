[EM]
EINLEITUNG = "Two function blocks come into question here, and they do <b>not</b> do the same thing. The <b>Spot Price Optimizer</b> works with prices and switches during the cheapest hours. The <b>Energy Manager</b> distributes <b>surplus</b> from the PV system by priority - it has no price input at all. To let prices influence the Energy Manager, use the three levers in the second table."
EM_HINWEIS = "The Energy Manager knows nothing about prices. It sees grid power, production, storage power and state of charge - and distributes what is left over. The rules of this plugin therefore act only indirectly: they permit grid import, force a start, or raise the minimum state of charge. If you want switching driven <b>purely</b> by price, the Spot Price Optimizer is the right block - or connect the rule output straight to the load, without the Energy Manager at all."
EM_TEXT = "The Energy Manager distributes surplus. The switching rules of this plugin intervene at three points - all three are connectable inputs on the block:"
H_EM = "Energy Manager - it has no price input"
H_SPOTOPT = "Spot Price Optimizer - this is where the hourly profile belongs"
H_TITEL = "Working together with the energy function blocks"
SPOTOPT_TEXT = "This block already exists in Loxone Config, and it does the same as the switching rules above: activate a given number of hours (<i>Demand</i>) within a period (<i>Period</i>) at the lowest prices. In <b>Spot Market</b> mode it fetches the prices itself - but <b>without taxes and levies</b>; the markups have to be entered there as a formula. That calculation is exactly what this plugin already does: grid fee, concession levy, electricity tax, surcharges and VAT. If you prefer to maintain the final price here rather than in a formula, set the block to <b>Absolute</b> or <b>Relative</b> and connect:"
SPOTOPT_WARNUNG = "<b>Important:</b> if the prices come from a virtual HTTP input, the block only uses a value when it was updated <b>within the current hour</b> - otherwise it discards it as outdated. The recommended polling every 300 s satisfies this; raising the polling interval blinds the block."
T_ANSCHLUSS = "Connector on the block"
T_BEDEUTUNG = "Meaning"
T_VONHIER = "From this plugin"
Z_ABSOLUT = "<b>Absolute</b> mode: one input per hour of the day. PH00 to 00:00, PH01 to 01:00 and so on."
Z_MINSOC = "Raise the minimum state of charge while the rule applies (e.g. 80 % instead of 10 %). The storage is then charged with highest priority - together with a positive offset also from the grid."
Z_O = "Price calculation: the block brings its own formula field. If you take the prices from here, leave it empty - the calculation has already been done."
Z_OFF = "Lock when the price is high: stop the whole block instead of a single load. Only sensible if <b>all</b> loads should depend on price."
Z_OFFSET = "Permit grid import while the rule applies. A positive value in kW means import from the grid is allowed - loads then run even without PV surplus."
Z_PRIO = "Feed the load number (1-12) while the rule applies. Starts exactly that load immediately. With a formula block: rule active - load number, otherwise 0."
Z_RELATIV = "<b>Relative</b> mode: one input per hour ahead. PR00 to +0, PR01 to +1 and so on."
Z_TRIGGER = "Trigger for the recalculation - e.g. the day pulse or plugging in the vehicle. Without a trigger the block does not recalculate."

