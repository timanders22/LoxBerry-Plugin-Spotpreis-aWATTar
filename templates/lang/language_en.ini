L_ART = "Kind of rule"
L_BIS = "Time window until (hour)"
L_HORIZONT = "Horizon (next X hours)"
L_N = "Number of hours N"
L_NAME = "Name (appears in the template)"
L_NEG = "always switch on when the exchange price is negative"
L_PROFIL = "Also send the hourly profile (PH00-PH23, PM00-PM23)"
L_PROZENT = "Distance from the daily average (%)"
L_SCHWELLE = "Fixed threshold (ct/kWh)"
L_VON = "Time window from (hour)"
P_NAME = "e.g. wallbox"
H_SELBSTTEST = "Self check: do template and output match?"
SELBSTTEST_FEHL = "These fields are in the template but NOT in the line sent to the Miniserver: %s. A virtual input on them would stay silent - without any error message."
SELBSTTEST_OK = "All %d fields of the template appear in the line sent to the Miniserver, and the template is well-formed XML."
SELBSTTEST_TEXT = "The template for Loxone Config and the line sent to the Miniserver come from the same table. This check generates both and compares them - because a search pattern the line does not deliver goes unnoticed in Loxone: the input simply stays at zero."
SELBSTTEST_XML = "The generated template is not well-formed XML - Loxone Config would reject it. Usually a special character in a rule name is the cause."
