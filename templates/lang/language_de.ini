ABO_PFLICHT = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die häufigste Fehlerursache überhaupt. Unter <i>System → MQTT Gateway → Subscriptions</i> eintragen und speichern."
