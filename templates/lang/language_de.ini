ABO_EINLEITUNG = "Das MQTT-Gateway ist seit LoxBerry 3 Bestandteil des Systems und liegt unter <i>System → MQTT Gateway</i>. Damit die Werte am Miniserver ankommen, muss es die Themen dieses Plugins kennen. Das Thema zum Abonnieren lautet:"
ABO_FASSUNG = "Erkannte Gateway-Fassung: <b>%s</b>."
