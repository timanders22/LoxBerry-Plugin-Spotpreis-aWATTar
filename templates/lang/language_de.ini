ABO_V2 = "<b>MQTT-Gateway V2 abonniert nur die Datenpunkte, die unter <i>System → MQTT Gateway → Subscriptions</i> angehakt sind.</b> Haken Sie genau diese Datenpunkte an – es sind die Namen der Tabelle in Schritt 2. Erscheint die Gruppe spot_awattar dort nicht, hat das Plugin noch nichts veröffentlicht: zuerst im Reiter Test nachsehen, ob gesendet wird."
