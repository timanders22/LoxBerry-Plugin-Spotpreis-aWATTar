[EM]
EINLEITUNG = "Zwei Bausteine kommen hier in Frage, und sie tun <b>nicht</b> dasselbe. Der <b>Spot Price Optimizer</b> rechnet mit Preisen und schaltet in den günstigsten Stunden. Der <b>Energiemanager</b> verteilt <b>Überschuss</b> aus der PV-Anlage nach Priorität - er hat überhaupt keinen Preiseingang. Wer Preise an den Energiemanager geben will, tut das über die drei Hebel in der zweiten Tabelle."
EM_HINWEIS = "Der Energiemanager kennt keinen Preis. Er sieht Netzbezug, Erzeugung, Speicherleistung und Ladezustand - und verteilt, was übrig ist. Die Regeln dieses Plugins wirken deshalb nur mittelbar: sie erlauben Netzbezug, erzwingen einen Start oder heben den Mindestladestand. Wer <b>ausschließlich</b> preisgesteuert schalten will, ist beim Spot Price Optimizer richtig - oder hängt den Regelausgang direkt an den Verbraucher, ganz ohne Energiemanager."
EM_TEXT = "Der Energiemanager verteilt Überschuss. Die Schaltregeln dieses Plugins greifen an drei Stellen ein - alle drei sind im Baustein verbindbare Eingänge:"
H_EM = "Energiemanager - er hat keinen Preiseingang"
H_SPOTOPT = "Spot Price Optimizer - hierher gehört das Stundenprofil"
H_TITEL = "Zusammenspiel mit den Energie-Bausteinen"
SPOTOPT_TEXT = "Diesen Baustein gibt es in Loxone Config bereits, und er macht dasselbe wie die Schaltregeln oben: eine bestimmte Anzahl Stunden (<i>Bedarf</i>) innerhalb eines Zeitraums (<i>Periode</i>) zu den niedrigsten Preisen einschalten. Im Modus <b>Spot Markt</b> holt er die Preise selbst - allerdings <b>ohne Steuern und Abgaben</b>, die Aufschläge muss man dort als Formel hinterlegen. Genau diese Rechnung macht dieses Plugin schon: Netzentgelt, Konzessionsabgabe, Stromsteuer, Umlagen und Umsatzsteuer. Wer den Endpreis lieber hier pflegt als in einer Formel, stellt den Baustein auf <b>Absolut</b> oder <b>Relativ</b> und verbindet:"
SPOTOPT_WARNUNG = "<b>Wichtig:</b> Der Baustein benutzt einen Preis nur, wenn er <b>innerhalb der laufenden Stunde</b> aktualisiert wurde - sonst verwirft er ihn als veraltet. Über MQTT sendet das Plugin die Stundenpreise deshalb jede Stunde neu; unter Gateway V2 die Stundenthemen als „Noncached“ anhaken (Hakenliste in Schritt 3). Bestehende Anlagen (HTTP): die empfohlene Abfrage alle 300 s erfüllt das; wer das Abfrageintervall hochsetzt, macht den Baustein blind."
T_ANSCHLUSS = "Anschluss am Baustein"
T_BEDEUTUNG = "Bedeutung"
T_VONHIER = "Von diesem Plugin"
Z_ABSOLUT = "Modus <b>Absolut</b>: je Eingang der Preis einer Tagesstunde. spot_awattar_stunde_0_ct an 00:00, spot_awattar_stunde_1_ct an 01:00 und so weiter (bestehende Anlagen über HTTP: PH00, PH01 …)."
Z_MINSOC = "Mindestladestand anheben, solange die Regel greift (z. B. 80 % statt 10 %). Der Speicher wird dann mit höchster Priorität geladen - zusammen mit einem positiven Offset auch aus dem Netz."
Z_O = "Preisberechnung: der Baustein bringt ein eigenes Formelfeld mit. Wer die Preise von hier nimmt, lässt es leer - gerechnet wurde schon."
Z_OFF = "Sperren, wenn der Preis hoch ist: statt eines Verbrauchers den ganzen Baustein anhalten. Nur sinnvoll, wenn <b>alle</b> Lasten preisabhängig sein sollen."
Z_OFFSET = "Netzbezug erlauben, solange die Regel greift. Ein positiver Wert in kW heißt: es darf aus dem Netz importiert werden - damit laufen Lasten auch ohne PV-Überschuss."
Z_PRIO = "Nummer der Last (1-12) aufschalten, solange die Regel greift. Startet genau diese Last sofort. Mit einem Formel-Baustein: Regel aktiv → Lastnummer, sonst 0."
Z_RELATIV = "Modus <b>Relativ</b>: je Eingang der Preis in N Stunden – nur für bestehende Anlagen über HTTP: PR00 an +0, PR01 an +1 und so weiter. Über MQTT gibt es kein relatives Profil; dort Modus Absolut nehmen."
Z_TRIGGER = "Auslöser für die Neuberechnung - z. B. der Tagesimpuls oder das Einstecken des Fahrzeugs. Ohne Auslöser rechnet der Baustein nicht neu."
HTTP_BESTAND = "bestehende Anlagen (HTTP):"
NUR_HTTP = "– (über MQTT kein relatives Profil)"

