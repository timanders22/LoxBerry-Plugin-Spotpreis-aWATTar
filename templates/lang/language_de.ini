H_ABO = "Schritt 3: Das MQTT-Gateway (Abo bzw. Haken)"
MQ_EINLEITUNG = "Neue Anlagen bekommen die Werte über MQTT: das Plugin sendet an das MQTT-Gateway des LoxBerry, das Gateway gibt sie an den Miniserver weiter. Die <b>Ansage</b> spricht das Plugin selbst, die <b>Push</b> verschickt der Miniserver. Der HTTP-Weg bleibt für bestehende Anlagen (Abschnitt ganz unten)."
MQ_S1_TITEL = "Schritt 1: MQTT im Plugin einschalten"
MQ_S1_TEXT = "Im Reiter <i>MQTT</i> „Preise per MQTT veröffentlichen“ einschalten und speichern. Das Plugin sendet dann bei jedem Minutenlauf das Lebenszeichen, bei jeder Änderung die geänderten Werte und alle 30 Minuten den vollen Satz."
MQ_S1_EIN = "MQTT ist eingeschaltet."
MQ_S1_AUS = "MQTT ist ausgeschaltet – über diesen Weg kommt nichts an."
MQ_S2_TITEL = "Schritt 2: Virtuelle Eingänge in Loxone Config anlegen"
MQ_S2_TEXT = "Für die Werte über das MQTT-Gateway gibt es keine Importvorlage. Je Wert dieser Tabelle in Loxone Config einen <b>Virtuellen Eingang</b> anlegen (<i>Peripherie → Virtuelle Eingänge → Virtueller Eingang</i>), keinen „Virtuellen HTTP-Eingang“. Der Name muss genau so lauten wie in der Tabelle (Kopierknopf) – das Gateway spricht den Eingang über den Namen an. „Als Digitaleingang verwenden“ <b>nicht</b> aktivieren, auch bei 0/1-Werten. %d Namen; wer nur einzelne Seiten baut, legt nur die Eingänge an, die deren Tabelle nennt."
NT_RECHTE = "Der am Miniserver hinterlegte LoxBerry-Benutzer braucht Rechte auf diese Eingänge – sonst schreibt das Gateway nichts hinein."
NT_MUSTER = "Einfacher: Wer die Seiten aus dem LoxBerry-Plugins Musterprojekt kopiert, bekommt die Eingänge mit."
