NT_NICHT_KOPIERT = "bitte markieren und kopieren"
HAKEN_TITEL = "Diese %d Datenpunkte anhaken – dieselben wie in der Namenstabelle (Schritt 2):"
HAKEN_NONCACHED = "Die 24 mit [Noncached] gekennzeichneten Stundenthemen in den Subscriptions zusätzlich als „Noncached“ markieren: das Plugin sendet die Stundenpreise jede Stunde neu, auch unverändert, und V2 reicht gleiche Werte sonst nicht an den Miniserver weiter."
HAKEN_RESET = "Kein Thema dieses Plugins braucht „Zurücksetzen nach Senden“."
HAKEN_PROFIL = "Die 24 Stundenpreise spot_awattar/stunde/0/ct … /23/ct gehen nur mit Stundenprofil „absolut“ oder „beides“ hinaus (Reiter Einstellungen); „relativ“ gibt es nur über HTTP."
RECONNECT = "Nach einem Neustart des Miniservers schickt der gemeinsame Baustein „Gateway alles neu senden“ (Seite „LoxBerry MQTT-Gateway“ im Musterprojekt) einmal <span class='sm-mono'>reconnect</span>; ohne ihn fehlen unter V2 ok, morgen_ok und alle Tageswerte, bis sie sich ändern."
HTTP_TITEL = "Für bestehende Anlagen: HTTP"
HTTP_TEXT = "Der HTTP-Endpunkt bleibt für Anlagen, die den Behälter „Spotpreis aWATTar“ (SPOT_…) nutzen; er liefert dieselben Werte. Neue Anlagen nehmen MQTT (Schritte 1 bis 3)."
BS_VORTEXT = "Fünf Seiten aus dem LoxBerry-Plugins Musterprojekt, jede für eine Aufgabe, alle über MQTT. Wer nur Preise sehen will, übernimmt die erste Seite; die übrigen bauen darauf auf und brauchen dieselben Virtuellen Eingänge (Namenstabelle in Schritt 2). Je Seite: Kasten mit den Schritten, Tabelle (eine Zeile je Baustein, von oben nach unten verbinden), Hinweise und ein Bild aus Loxone Config. Ein UND oder ODER hat zwei Eingänge, an jedem Eingang hängt genau eine Quelle; die Bausteine findet Config über die Baustein-Suche (F5). Wer seine Seiten mit dem HTTP-Behälter „Spotpreis aWATTar“ gebaut hat, nutzt ihn weiter (Abschnitt „Für bestehende Anlagen: HTTP“); dort heißen die Eingänge SPOT_… statt spot_awattar_…."
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
H_EN = "Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
BILD_ALT = "Bausteine der Seite „%s“ in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
S1_S1 = "Im Plugin Reiter „Einstellungen“ Markt (DE/AT) und die Preisbestandteile der eigenen Stromrechnung eintragen (Netzentgelt, Konzession, Umlagen, Umsatzsteuer), speichern. Reiter „MQTT“: „Preise per MQTT veröffentlichen“ einschalten, Themenpräfix spot_awattar lassen, speichern."
S1_S2 = "Im LoxBerry unter System → MQTT Gateway: bei Gateway-Fassung 1 das Abo spot_awattar/# eintragen, bei Fassung 2 die Datenpunkte anhaken (Liste im Reiter „Einbindung in Loxone“, Schritt 3). Ohne diesen Schritt kommt am Miniserver nichts an."
S1_S3 = "Reiter „Einbindung in Loxone“, Schritt 2: je Wert der Namenstabelle in Loxone Config einen Virtuellen Eingang anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang) – keinen Virtuellen HTTP-Eingang. Name genau wie in der Tabelle (Kopierknopf), „Als Digitaleingang verwenden“ nicht aktivieren. Für diese Seite reichen die 14 Eingänge der Liste. Einfacher: die Seite aus dem LoxBerry-Plugins Musterprojekt kopieren – dann kommen die Eingänge mit. Der am Miniserver hinterlegte LoxBerry-Benutzer braucht Rechte auf die Eingänge."
S1_S4 = "Seite „Spotpreis aWATTar“ anlegen und die 14 Virtuellen Eingänge der Liste darauf ziehen (Nr. 1–10, 19–21, 24), dazu die Konstante 1 aus dem Baum. An spot_awattar_cur im Eigenschaftsfenster „Statistik“ einschalten."
S1_S5 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Spotpreis gestört (aWATTar)“, „Meldung Strompreis-Push (aWATTar)“, „Meldung Test-Push (aWATTar)“, Text wie in der Liste, auf die Seite ziehen. Jede bekommt genau eine Leitung."
S1_S6 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden. Analogwertvalidierung Nr. 12: Haken bei ‚En‘ im Eigenschaftsfenster entfernen. Status „Strompreis jetzt (aWATTar)“: vorher viermal „+“ (V5–V8); die Zeilen der Status in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
S1_S7 = "Speichern und übertragen. Probe: „Spotpreis-Zustand (aWATTar)“ zeigt „läuft – Preise für heute da“; spot_awattar_status_zaehler kommt jede Minute eins weiter. Im Plugin Reiter „Test“ „Test-Pushnachricht“ – mit dem nächsten Minutenlauf kommt „Meldung Test-Push (aWATTar)“."
S1_H1 = "Push: im Plugin Reiter „Einstellungen“ unter „Ansage und Push je Stunde“ den Push einschalten und die Stunden wählen. Die Ansage spricht das Plugin selbst – kein Baustein."
S1_H2 = "Die Störungsmeldung kommt nach 5 Minuten ohne Preise; meldet sich das Plugin nicht mehr (LoxBerry aus, Cron steht, MQTT aus oder Gateway steht), nach etwa 20 Minuten (15 Minuten Prüfzeit der Analogwertvalidierung Nr. 12, dann 5 Minuten Einschaltverzögerung Nr. 15). Steht das Plugin, behalten alle Eingänge ihren letzten Wert – nur der stehende Laufzähler spot_awattar_status_zaehler verrät es."
S1_H3 = "„Keine Preise“ (Nr. 13) hängt an spot_awattar_ok (Preise für heute; über HTTP hieß er HOK), nie an spot_awattar_morgen_ok (über HTTP OK) – sonst meldet die Seite jeden Vormittag eine Störung."
S1_H4 = "Push und Test-Push (Nr. 19, 20, 24) sind digitale Eingänge und kommen direkt ans UND bzw. an die Benachrichtigung – kein Schwellwertschalter dahinter."
S1_H5 = "An eine Benachrichtigung nie mehrere Quellen direkt legen – sie meldet nur beim Wechsel von Aus auf Ein; weitere Auslöser über ein ODER davor."
S1_H6 = "Zur Gegenprobe im Plugin Reiter „MQTT“ „Preise per MQTT veröffentlichen“ kurz ausschalten: nach etwa 20 Minuten muss „Meldung Spotpreis gestört (aWATTar)“ kommen; danach wieder einschalten. Bleibt sie aus, prüft die Kette nichts."
S1_H7 = "Nach einem Neustart des Miniservers schickt der Baustein „Gateway alles neu senden“ der Seite „LoxBerry MQTT-Gateway“ (Musterprojekt) einmal reconnect an das Gateway; ohne ihn fehlen unter Gateway V2 spot_awattar_ok, spot_awattar_morgen_ok und alle Tageswerte, bis sie sich ändern."
S2_S1 = "Im Plugin Reiter „Einstellungen“ je Gerät eine Schaltregel einrichten: „Schaltregel 1 benutzen“, Name (z. B. „Wallbox“), Art (die N günstigsten Stunden am Stück, Einzelstunden, unter einem festen Preis oder ein Abstand unter dem Tagesmittel), Anzahl Stunden, Zeitfenster, wahlweise Frist („Fertig bis“), Leistung und Rang. Wer mehrere große Geräte hat, trägt im Abschnitt „Fahrplaner“ das Leistungsbudget ein; wer eine PV-Prognose oder einen Speicher hat, deren Adresse."
S2_S2 = "Virtuelle Eingänge aus Seite „Spotpreis aWATTar“, Schritt 3 (nicht erneut anlegen); fehlende aus der Namenstabelle (Reiter „Einbindung in Loxone“, Schritt 2) ergänzen. Neue Seite „Spotpreis aWATTar Steuerung“ anlegen, die 25 Eingänge der Liste ziehen (spot_awattar_regel_1_aktiv … spot_awattar_regel_4_sperre, spot_awattar_status_zaehler ein weiteres Mal), dazu die Konstante 1."
S2_S3 = "Analogwertvalidierung, vier UND und vier Status über F5 setzen. Analogwertvalidierung Nr. 27: Haken bei ‚En‘ im Eigenschaftsfenster entfernen. An den UND Nr. 28–31 den Eingang I2 negieren: einmal auf den Eingangspunkt von I2 klicken, danach zeigt der Eingang einen kleinen Kreis. „+“: jede „Schaltregel n (aWATTar)“ dreimal (V5–V7). Die Zeilen einmal in „Schaltregel 1 (aWATTar)“ eintragen, dann den Baustein kopieren und nur die Eingänge umhängen."
S2_S4 = "Die Ausgänge der vier UND „Regel n schaltet (aWATTar)“ an die eigenen Geräte legen (Schaltaktor, Freigabe-Eingang der Wallbox …) – nicht spot_awattar_regel_1_aktiv … spot_awattar_regel_4_aktiv direkt, sonst fehlt die Absicherung."
S2_S5 = "Speichern und übertragen. Probe: „Schaltregel 1 (aWATTar)“ zeigt „wartet – Start in … Stunden“ oder „läuft“."
S2_H1 = "Die Schaltregeln rechnet das Plugin fertig; in Loxone bleibt ein Ausgang je Gerät. Eine Regel, die im Plugin aus ist, liefert immer 0 („nichts geplant“)."
S2_H2 = "Begonnene Blöcke laufen zu Ende (im Abschnitt „Fahrplaner“, ab Werk an) – das Gerät schaltet nicht mitten im Lauf ab, wenn es später billiger wird."
S2_H3 = "Warum eine Regel nicht läuft, sagt ihr Status: PV-Prognose, Speicherstand oder das Leistungsbudget („Stunden ans Leistungsbudget verloren“)."
S2_H4 = "Steht der LoxBerry, blieben spot_awattar_regel_1_aktiv … spot_awattar_regel_4_aktiv auf ihrem letzten Wert. Die Analogwertvalidierung Nr. 27 nimmt nach 15 Minuten über die UND alle vier Schaltausgänge weg; der Status zeigt dann „ausgesetzt“. Fehlen die Preise, schickt das Plugin die Schaltsignale selbst als 0."
S2_H5 = "Wer einen Energiemanager nutzt (Seite „WaermepumpeCloud“), kann eine Regel dort über eine Formel an Prio, Offset oder MinSoc legen (Reiter „Einbindung in Loxone“, Abschnitt Energiemanager) – nicht Teil dieser Seite."
S3_S1 = "Virtuelle Eingänge aus Seite „Spotpreis aWATTar“, Schritt 3 (nicht erneut anlegen); fehlende aus der Namenstabelle (Reiter „Einbindung in Loxone“, Schritt 2) ergänzen. Die Länge des günstigsten Fensters stellt man im Plugin ein (ab Werk 3 Stunden)."
S3_S2 = "Neue Seite „Spotpreis aWATTar Werte“ anlegen, die 18 Eingänge der Liste ziehen (Nr. 1–14 und 25–28)."
S3_S3 = "Benachrichtigung „Meldung Tagesvorschau mit Zahlen (aWATTar)“ anlegen (Peripherie → Mitteilungen → Benachrichtigung); ihren Text liefert der Status Nr. 40 (Ausgang TQ an den Texteingang der Benachrichtigung). Virtuelle Eingänge „Start bei günstigem Strom (aWATTar)“ und „Tagesvorschau-Push aus (aWATTar)“ als Schalter, „Tagesvorschau jetzt senden (aWATTar)“ als Taste anlegen."
S3_S4 = "Übrige Bausteine über F5. „Impuls um“ auf 20:00:00 stellen (Config legt ihn mit 00:00:00 an). „Gleich“: V2 = 0 eintragen, zweiten Eingang offen lassen. Am UND Nr. 32 den Eingang I2 negieren: einmal auf den Eingangspunkt von I2 klicken, danach zeigt der Eingang einen kleinen Kreis. Sechs Analogspeicher Nr. 34–39: V = Wert, Set = Ausgang des ODER Nr. 33. „+“: „Strompreise heute (aWATTar)“ einmal, „Strompreise morgen (aWATTar)“ und „Tagesvorschau-Text (aWATTar)“ je zweimal; beim Tagesvorschau-Text „Visualisierung“ aus."
S3_S5 = "Speichern und übertragen. Probe: nach 14 Uhr „Tagesvorschau jetzt senden (aWATTar)“ drücken – es kommt eine Push „Strom morgen: am günstigsten … Uhr …“; um 20 Uhr kommt sie von selbst, solange „Tagesvorschau-Push aus (aWATTar)“ aus ist. „Fahrplaner (aWATTar)“ zeigt Leistungsbudget, PV-Prognose und Speicher."
S3_H1 = "„Start-Freigabe Gerät (aWATTar)“ (Nr. 24) ist der Schaltausgang für eine Schaltsteckdose oder einen Startbefehl. Gerät vorbereiten, in der App „Start bei günstigem Strom (aWATTar)“ einschalten – im Fenster geht der Ausgang auf 1. Nach dem Lauf den Schalter wieder ausschalten."
S3_H2 = "Für Geräte, die eine Frist kennen („bis 7 Uhr fertig“), ist eine Schaltregel auf der Seite „Spotpreis aWATTar Steuerung“ besser."
S3_H3 = "„Gleich“ (Nr. 21) statt eines invertierten Schwellwertschalters: sonst zählte -1 („kein Fenster“) als „läuft“. spot_awattar_morgen_ok (Nr. 6) kommt als digitaler Eingang direkt ans UND."
S3_H4 = "PV-Prognose und Speicherquelle trägt man im Plugin ein (Abschnitt „Fahrplaner“); spot_awattar_plan_soc kommt aus der dort eingetragenen Adresse, nicht aus Loxone. Ohne Quelle stehen dort 0 (PV-Prognose) bzw. -1 (Speicher)."
S3_H5 = "spot_awattar_minh_morgen und spot_awattar_maxh_morgen stehen auf -1, solange die Preise für morgen fehlen (ab Plugin 1.2.38; vorher 0, was wie „0 Uhr“ aussah)."
S3_H6 = "Die Analogspeicher Nr. 34–39 übernehmen die Werte nur beim Abtasten (20 Uhr oder Taste) – sonst käme bei jeder Wertänderung eine neue Push. Vor der ersten Abtastung und ohne Preise für morgen bleibt der Text leer, und es kommt keine Push."
S3_H7 = "Ein virtueller Eingang hat keinen Startwert – deshalb ist der Schalter Nr. 30 als Sperre gebaut: ab Werk aus heißt, die Push um 20 Uhr kommt."
S3_H8 = "Nr. 20 „Meldung Tagesvorschau (aWATTar)“ entfällt (ersetzt durch Nr. 41); wer sie nach der früheren Liste gebaut hat, löscht sie – sonst kommen zwei Pushes."
S4_S1 = "Im Plugin die Schwellen „günstig“ (ab Werk 20 ct) und „teuer“ (ab Werk 35 ct), die CO₂-Schwelle (200 g/kWh) und für den Tarifvergleich im Reiter „Kostenvergleich“ den eigenen festen Preis eintragen; wer einen eigenen Zählpunkt nach §14a hat, schaltet ihn ein."
S4_S2 = "Virtuelle Eingänge aus Seite „Spotpreis aWATTar“, Schritt 3 (nicht erneut anlegen); fehlende aus der Namenstabelle (Reiter „Einbindung in Loxone“, Schritt 2) ergänzen. Neue Seite „Spotpreis aWATTar Freigaben und Tarif“ anlegen, die 15 Eingänge der Liste ziehen (spot_awattar_level, spot_awattar_neg, spot_awattar_cur und spot_awattar_status_zaehler ein weiteres Mal), dazu die Konstante 1."
S4_S3 = "Virtuellen Eingang „Hochpreis-Sperre ein (aWATTar)“ als Schalter und Benachrichtigung „Meldung Tarifwechsel prüfen (aWATTar)“ anlegen, Text wie in der Liste."
S4_S4 = "Übrige Bausteine über F5. „Gleich“: V2 = 1, zweiten Eingang offen lassen. Analogwertvalidierung Nr. 33: Haken bei ‚En‘ im Eigenschaftsfenster entfernen; an den UND Nr. 34–36 den Eingang I2 negieren: einmal auf den Eingangspunkt von I2 klicken, danach zeigt der Eingang einen kleinen Kreis. „+“: „Freigaben jetzt (aWATTar)“ dreimal (V5–V7), „Tarifvergleich (aWATTar)“ einmal."
S4_S5 = "Speichern und übertragen. Probe: „Freigaben jetzt (aWATTar)“ zeigt den Preis; in einer günstigen Stunde „große Verbraucher frei“."
S4_H1 = "Drei Schaltausgänge: Nr. 10 (günstig oder negativ), Nr. 14 (Sperre bei Hochpreis), Nr. 16 (sauber oder günstig). Sie folgen dem Preis Stunde für Stunde; die Schaltregeln (Seite „Spotpreis aWATTar Steuerung“) planen dagegen voraus."
S4_H2 = "Ohne Preise und wenn das Plugin sich 15 Minuten nicht meldet, sind alle Freigaben aus – mit Absicht (Analogwertvalidierung Nr. 33 und die UND Nr. 34–36). Fehlen die Preise, schickt das Plugin über MQTT spot_awattar_level, spot_awattar_rank und spot_awattar_rankd sofort als -1 (ab Plugin 1.2.38) – die Freigaben fallen dann gleich ab, nicht erst nach 15 Minuten."
S4_H3 = "„Gleich“ (Nr. 8) statt eines invertierten Schwellwertschalters: sonst zählte -1 („keine Preise“) als „günstig“. spot_awattar_neg und spot_awattar_co2_clean kommen als digitale Eingänge direkt ans ODER."
S4_H4 = "Den Monatsbericht zum Tarifvergleich spricht das Plugin am Monatsersten selbst (wenn die Ansage an ist)."
S5_S1 = "Im Plugin Reiter „Einstellungen“ muss „Stundenprofil mitsenden (PH00-PH23, PM00-PM23)“ auf „absolut“ oder „beides“ stehen (ab Werk „absolut“) – nur dann sendet das Plugin die 24 Themen spot_awattar/stunde/0/ct … spot_awattar/stunde/23/ct (ab Plugin 1.2.38). In Loxone Config je Thema einen Virtuellen Eingang spot_awattar_stunde_0_ct … spot_awattar_stunde_23_ct anlegen (Namenstabelle, Schritt 2; „Als Digitaleingang verwenden“ nicht aktivieren); unter Gateway V2 die 24 Datenpunkte anhaken und als „Noncached“ markieren (das Plugin sendet sie jede Stunde neu, auch unverändert)."
S5_S2 = "Neue Seite „Spotpreis aWATTar Stundenprofil“ anlegen, die 24 Eingänge spot_awattar_stunde_0_ct … spot_awattar_stunde_23_ct ziehen und spot_awattar_ok ein weiteres Mal. Zweimal „Impuls um“ über F5 setzen und auf 00:05:00 bzw. 00:35:00 stellen, dazu das ODER „Neuberechnung auslösen (aWATTar)“."
S5_S3 = "Spotpreis-Optimierer über F5 setzen und „Günstigste Stunden (aWATTar)“ nennen. Im Eigenschaftsfenster Modus „Absolut“ wählen – Config warnt und empfiehlt „Spotmarkt“; die Warnung mit „Ja“ bestätigen. „Spotmarkt“ ist die Alternative ohne Plugin (der Baustein holt die Börsenpreise dann selbst, ohne Netzentgelt und Steuern). Formelfeld leer, Bedarf 4 h, Periode 24 h, Mindestlaufzeit 1 h."
S5_S4 = "Von Hand verbinden: die Eingänge 00:00 bis 23:00 des Optimierers der Reihe nach mit spot_awattar_stunde_0_ct bis spot_awattar_stunde_23_ct, Eingang Tr mit dem Ausgang des ODER „Neuberechnung auslösen (aWATTar)“; an dessen Eingänge die Ausgänge Q der beiden „Impuls um“."
S5_S5 = "Status „Stundenprofil (aWATTar)“ über F5, zweimal „+“ (V5, V6), die Ausgänge Cv, Min, Max, Avg und O des Optimierers an V1 bis V5 legen, spot_awattar_ok an V6; Ausgang O zusätzlich an den eigenen Verbraucher. Speichern und übertragen. Probe: nach 00:05 Uhr zeigt der Status die Preise des Tages."
S5_H1 = "Die Leitungen am Spotpreis-Optimierer zieht das Leitungswerkzeug nicht – alle 30 von Hand (24 Stundenpreise, Tr und fünf Status-Eingänge)."
S5_H2 = "Die Preise sind Endpreise in ct/kWh; der Baustein erwartet eine Währung. Die Reihenfolge der Stunden bleibt gleich, den Parameter „Max“ dann in ct angeben."
S5_H3 = "Der Baustein macht dasselbe wie eine Schaltregel (Seite „Spotpreis aWATTar Steuerung“). Wer Schaltregeln nutzt, braucht diese Seite nicht – nie beide Wege an dasselbe Gerät legen."
S5_H4 = "Die 24 Stundenpreise wechseln um Mitternacht in einem Stoß, und der UDP-Eingang des Gateways verliert unter Last Pakete. Spätestens 31 Minuten später schickt das Plugin alle Werte noch einmal – deshalb rechnet „Nachberechnung 00:35 (aWATTar)“ den Optimierer ein zweites Mal."
S5_H5 = "Ohne Preise für heute schickt das Plugin keine Stundenpreise; dann bleiben die des Vortags stehen, und der Status sagt es („keine Preise für heute“). Fehlt eine einzelne Stunde (Zeitumstellung im Frühjahr), steht dort der Tageshöchstpreis – so wählt der Optimierer sie nie."
S5_H6 = "Über MQTT gibt es nur die Preise für heute; die Befehle SPOT_PM00 … SPOT_PM23 (morgen) des HTTP-Behälters haben kein Gegenstück, der Optimierer hat ohnehin nur Eingänge für den laufenden Tag."
