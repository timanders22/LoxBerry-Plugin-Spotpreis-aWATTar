H_TITEL = "Zusammenspiel mit den Energie-Bausteinen"
SPOTOPT_TEXT = "Diesen Baustein gibt es in Loxone Config bereits, und er macht dasselbe wie die Schaltregeln oben: eine bestimmte Anzahl Stunden (<i>Bedarf</i>) innerhalb eines Zeitraums (<i>Periode</i>) zu den niedrigsten Preisen einschalten. Im Modus <b>Spot Markt</b> holt er die Preise selbst - allerdings <b>ohne Steuern und Abgaben</b>, die Aufschläge muss man dort als Formel hinterlegen. Genau diese Rechnung macht dieses Plugin schon: Netzentgelt, Konzessionsabgabe, Stromsteuer, Umlagen und Umsatzsteuer. Wer den Endpreis lieber hier pflegt als in einer Formel, stellt den Baustein auf <b>Absolut</b> oder <b>Relativ</b> und verbindet:"
SPOTOPT_WARNUNG = "<b>Wichtig:</b> Kommen die Preise von einem virtuellen HTTP-Eingang, benutzt der Baustein einen Wert nur, wenn er <b>innerhalb der laufenden Stunde</b> aktualisiert wurde - sonst verwirft er ihn als veraltet. Die empfohlene Abfrage alle 300 s erfüllt das; wer das Abfrageintervall hochsetzt, macht den Baustein blind."
