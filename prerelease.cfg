[AUTOUPDATE]
# Vorabfassungen (Prereleases) fuer alle, die sie ausdruecklich einschalten.
#
# WARUM ES DIESE DATEI GIBT: In der plugin.cfg steht PRERELEASECFG. Ist der
# Wert dort gesetzt, die Datei aber nicht vorhanden, holt LoxBerry beim
# Pruefen auf Vorabfassungen eine 404 und meldet einen Fehler, den niemand
# zuordnen kann. Eine prerelease.cfg OHNE VERSION-Zeile waere der
# schlechteste Fall: wird sie doch einmal ausgewertet, gilt "keine Version"
# je nach Lesart als aeltere - das Plugin wuerde sich selbst herunterstufen.
#
# Solange VERSION hier dasselbe sagt wie in der release.cfg, wird niemandem
# etwas angeboten. Sobald es eine echte Vorabfassung gibt, wird hier - und
# NUR hier - erhoeht.
VERSION=1.2.2
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-aWATTar/archive/refs/tags/v1.2.2.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Spotpreis-aWATTar/releases/tag/v1.2.2
