<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Center Motif: Original aWATTar Blitz & Preiskurve -->
    <g transform="translate(61.44, 4.24) scale(0.76)">
      <!-- Blitz (Exakter Pfad aus der Originaldatei) -->
      <path d="M 272 88 L 192 206 L 238 206 L 220 264 L 312 142 L 262 142 Z" />

      <!-- Preiskurve: 5 Stundenbalken & Grundlinie -->
      <rect x="147" y="330" width="34" height="70" rx="6" />
      <rect x="195" y="300" width="34" height="100" rx="6" />
      <rect x="243" y="270" width="34" height="130" rx="6" />
      <rect x="291" y="306" width="34" height="94" rx="6" />
      <rect x="339" y="344" width="34" height="56" rx="6" />
      <rect x="139" y="400" width="234" height="14" rx="7" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5">Spotpreis aWATTar</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>